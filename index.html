<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Callback Mercado Livre</title>
  <style>
    :root { --bg:#F7F8FC; --card:#fff; --text:#171923; --muted:#5F6A7D; --accent:#D93D21; --border:#E7EAF0; --ok:#12724E; --err:#C53030; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text);
           font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
    main { width:min(560px,100%); background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px;
           box-shadow:0 1px 2px rgba(23,25,35,.04),0 4px 14px rgba(23,25,35,.05); }
    h1 { font-size:20px; margin:0 0 8px; }
    p { margin:8px 0; color:var(--muted); }
    .code { display:block; width:100%; padding:12px; margin:12px 0 4px; border:1px solid var(--border); border-radius:9px;
            background:var(--bg); font:14px/1.4 ui-monospace,Consolas,monospace; color:var(--text); overflow-wrap:anywhere; user-select:all; }
    button { margin-top:12px; min-height:40px; padding:0 16px; border:0; border-radius:9px; background:var(--accent); color:#fff;
             font:600 14px system-ui,sans-serif; cursor:pointer; }
    button:focus-visible { outline:2px solid var(--text); outline-offset:2px; }
    .ok { color:var(--ok); font-weight:600; } .err { color:var(--err); font-weight:600; }
    small { color:var(--muted); display:block; margin-top:16px; }
  </style>
</head>
<body>
  <main>
    <h1>Autorização do Mercado Livre</h1>
    <div id="out" role="status" aria-live="polite"><p>Carregando…</p></div>
    <small>Esta página é estática: ela só mostra o que o Mercado Livre enviou na URL. Nada é enviado, salvo ou registrado. O código só funciona junto com o segredo da sua aplicação, que fica apenas no seu computador.</small>
  </main>
  <script>
    (function () {
      var out = document.getElementById("out");
      var q = new URLSearchParams(location.search);
      var code = q.get("code"), state = q.get("state"), error = q.get("error");
      function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
      out.replaceChildren();

      if (error) {
        out.append(el("p", "err", "O Mercado Livre retornou um erro: " + error),
                   el("p", null, q.get("error_description") || "Volte ao painel e tente conectar novamente."));
      } else if (!code) {
        out.append(el("p", null, "Nenhum código recebido. Esta página só funciona quando aberta pelo Mercado Livre após você autorizar a aplicação."));
      } else {
        out.append(el("p", "ok", "Autorização concluída. Copie o código abaixo e cole no painel (Configurações → API do Mercado Livre)."),
                   el("span", null, "Código:"));
        var c = el("code", "code", code); out.append(c);
        if (state) { out.append(el("span", null, "State (o painel confere sozinho):"), el("code", "code", state)); }
        var b = el("button", null, "Copiar código"); b.type = "button";
        b.addEventListener("click", function () {
          var done = function () { b.textContent = "Copiado!"; };
          if (navigator.clipboard) navigator.clipboard.writeText(code).then(done, function () { var r = document.createRange(); r.selectNodeContents(c); var s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selecionado: use Ctrl+C"; });
          else { var r = document.createRange(); r.selectNodeContents(c); var s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selecionado: use Ctrl+C"; }
        });
        out.append(b);
      }
      // Drop the code from the address bar / history once displayed.
      try { history.replaceState(null, "", location.pathname); } catch (e) { /* ignore */ }
    })();
  </script>
</body>
</html>
